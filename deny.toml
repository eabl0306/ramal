# Politica de dependencias para cargo-deny, para todo el workspace de Rust.
#
#   cargo deny check        (just rust-deny)
#
# Falla si aparece un aviso de seguridad, una licencia no aprobada, una fuente
# que no sea crates.io o una dependencia baneada. Mira el grafo entero, tambien
# el del crate de escritorio aunque no este en default-members.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Excepcion de Tauri. proc-macro-error es una macro de compilacion sin
  # mantenimiento que llega solo por glib-macros 0.18, la de los bindings de GTK3
  # con los que Tauri 2 dibuja en Linux (ramal-desktop). No acaba en el binario y
  # no tiene version arreglada: se quita cuando Tauri pase a GTK4.
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error solo llega por los bindings GTK3 de Tauri 2 en Linux; macro de compilacion sin version arreglada" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Cada licencia que no sea obvia lleva al lado el crate que la trae. Una nueva se
# anade solo despues de leerla, nunca para que la CI pase.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots: la lista de CAs de Mozilla se publica con esta licencia.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# Los crates del workspace llevan la licencia del proyecto (FSL-1.1-ALv2, que no
# esta en allow porque es nuestra y no de una dependencia) y no se publican
# (publish = false): esta lista vigila lo que entra de fuera, no lo propio.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Nada de crates que dupliquen lo que ya trae el stack elegido. openssl queda
# fuera porque TLS va con rustls en todas partes: si una dependencia nueva lo
# arrastra (git2 con https, por ejemplo), se busca la feature de rustls antes de
# tocar esta lista.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "actix-web" },
  # Excepcion de Tauri: el servidor WebDriver embebido del E2E nativo
  # (tauri-plugin-wdio-webdriver, solo con la feature `e2e` de ramal-desktop) se
  # apoya en axum. Fuera de ese plugin sigue vetado: la API usa Salvo.
  { name = "axum", wrappers = ["tauri-plugin-wdio-webdriver"] },
  { name = "rocket" },
  # El motor usa la CLI de git y nunca libgit2 (ADR 0009). Vetarlos aqui impide
  # que entren por la puerta de atras como dependencia transitiva.
  { name = "git2" },
  { name = "libgit2-sys" },
]
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
