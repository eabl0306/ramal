<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Ubuntu,Cantarell,sans-serif;font-size:14px;
--bg:oklch(0.185 0.008 230);--surface:oklch(0.24 0.01 230);--border:oklch(0.315 0.012 230);--text:oklch(0.95 0.005 230);--muted:oklch(0.76 0.012 230);
--accent:oklch(0.74 0.12 190);--accent-ink:oklch(0.2 0.03 190);--ok:oklch(0.76 0.15 150);--danger:oklch(0.7 0.17 25);--faint:oklch(0.62 0.012 230);
background:var(--bg);color:var(--text)}
@media (prefers-color-scheme: light){body{--bg:oklch(0.975 0.004 230);--surface:oklch(1 0 0);--border:oklch(0.9 0.008 230);--text:oklch(0.24 0.012 230);--muted:oklch(0.44 0.012 230);
--accent:oklch(0.54 0.1 190);--accent-ink:oklch(0.99 0.005 190);--ok:oklch(0.52 0.13 150);--danger:oklch(0.55 0.18 25);--faint:oklch(0.54 0.01 230)}}
*{box-sizing:border-box}
a{color:var(--accent)} a:hover{color:var(--text)}
</style>
</helmet>
<main style="min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text)">
  <div style="width:100%;max-width:420px;padding:32px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:17px">R</div>
      <span style="font-weight:600;font-size:15px">{{ product }}</span>
    </div>
    <div style="width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700;background:{{ iconBg }};color:{{ iconColor }}">{{ icon }}</div>
    <div>
      <h1 style="margin:0;font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-0.01em">{{ title }}</h1>
      <p style="margin:8px 0 0;color:var(--muted);line-height:1.55">{{ text }}</p>
    </div>
    <p style="margin:0;font-size:12px;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">127.0.0.1 · Git Rudder</p>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:520},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;signin&quot;,&quot;platform&quot;],&quot;default&quot;:&quot;signin&quot;,&quot;tsType&quot;:&quot;'signin'|'platform'&quot;},&quot;client&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;desktop&quot;,&quot;vscode&quot;],&quot;default&quot;:&quot;desktop&quot;,&quot;tsType&quot;:&quot;'desktop'|'vscode'&quot;},&quot;result&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;success&quot;,&quot;cancelled&quot;,&quot;error&quot;],&quot;default&quot;:&quot;success&quot;,&quot;tsType&quot;:&quot;'success'|'cancelled'|'error'&quot;},&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;GitLab&quot;,&quot;Bitbucket&quot;],&quot;default&quot;:&quot;GitLab&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;es&quot;,&quot;en&quot;],&quot;default&quot;:&quot;es&quot;,&quot;tsType&quot;:&quot;'es'|'en'&quot;}}">
const TX = {
  lcOkTitle: ['Sesión iniciada en {client}', 'Signed in to {client}'], lcOk: ['Ya puedes volver a la app y cerrar esta pestaña.', 'You can go back to the app and close this tab.'],
  lcCancelTitle: ['Inicio de sesión cancelado', 'Sign-in cancelled'], lcCancel: ['Vuelve a {client} si quieres intentarlo de nuevo.', 'Go back to {client} if you want to try again.'],
  lcErrTitle: ['No se pudo iniciar sesión', "Couldn't sign in"], lcErr: ['{reason}. Vuelve a {client} e inténtalo de nuevo.', '{reason}. Go back to {client} and try again.'],
  lpOkTitle: ['Cuenta de {platform} conectada', '{platform} account connected'], lpOk: ['Vuelve a Git Rudder para terminar. Puedes cerrar esta pestaña.', 'Go back to Git Rudder to finish. You can close this tab.'],
  lpErrTitle: ['{platform} no autorizó la conexión', "{platform} didn't authorize the connection"], lpErr: ['Motivo: {reason}. Vuelve a Git Rudder e inténtalo de nuevo.', 'Reason: {reason}. Go back to Git Rudder and try again.'],
  reasonSignin: ['La autorización caducó', 'The authorization expired'], reasonCancelled: ['cancelaste el acceso', 'you cancelled access']
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props, L = p.lang === 'en' ? 1 : 0, kind = p.kind || 'signin', res = p.result || 'success', platform = p.platform || 'GitLab';
    const client = (p.client || 'desktop') === 'vscode' ? 'Git Rudder for VS Code' : 'Git Rudder Desktop';
    const t = (k, v) => { let s = TX[k][L]; for (const x in v || {}) s = s.split('{' + x + '}').join(v[x]); return s; };
    let title, text;
    if (kind === 'signin') { const k = res === 'success' ? 'lcOk' : res === 'cancelled' ? 'lcCancel' : 'lcErr'; title = t(k + 'Title', { client }); text = t(k, { client, reason: t('reasonSignin') }); }
    else if (res === 'success') { title = t('lpOkTitle', { platform }); text = t('lpOk'); }
    else { title = t('lpErrTitle', { platform }); text = t('lpErr', { reason: res === 'cancelled' ? t('reasonCancelled') : 'access_denied' }); }
    const c = res === 'success' ? 'var(--ok)' : res === 'cancelled' ? 'var(--faint)' : 'var(--danger)';
    return { product: kind === 'signin' ? client : 'Git Rudder', title, text, icon: res === 'success' ? '✓' : res === 'cancelled' ? '×' : '!', iconColor: c, iconBg: `color-mix(in oklch, ${c} 16%, transparent)` };
  }
}
</script>
</body>
</html>
