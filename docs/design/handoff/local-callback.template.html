<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>{{title}} · Ramal</title>
<style>
:root{--bg:oklch(0.185 0.008 230);--surface:oklch(0.24 0.01 230);--border:oklch(0.315 0.012 230);--text:oklch(0.95 0.005 230);--muted:oklch(0.76 0.012 230);--faint:oklch(0.62 0.012 230);--accent:oklch(0.74 0.12 190);--accent-ink:oklch(0.2 0.03 190);--ok:oklch(0.76 0.15 150);--danger:oklch(0.7 0.17 25)}
@media (prefers-color-scheme: light){:root{--bg:oklch(0.975 0.004 230);--surface:oklch(1 0 0);--border:oklch(0.9 0.008 230);--text:oklch(0.24 0.012 230);--muted:oklch(0.44 0.012 230);--faint:oklch(0.54 0.01 230);--accent:oklch(0.54 0.1 190);--accent-ink:oklch(0.99 0.005 190);--ok:oklch(0.52 0.13 150);--danger:oklch(0.55 0.18 25)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Ubuntu,Cantarell,sans-serif}
.card{width:100%;max-width:420px;padding:32px;border-radius:18px;background:var(--surface);border:1px solid var(--border);display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:17px}
.icon{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:700}
.success .icon{color:var(--ok);background:color-mix(in oklch,var(--ok) 16%,transparent)}
.cancelled .icon{color:var(--faint);background:color-mix(in oklch,var(--faint) 16%,transparent)}
.error .icon{color:var(--danger);background:color-mix(in oklch,var(--danger) 16%,transparent)}
h1{margin:0;font-size:22px;font-weight:600;line-height:1.3}
p{margin:8px 0 0;color:var(--muted)}
.foot{margin:0;font-size:12px;color:var(--faint);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<main class="card {{result}}">
  <div class="brand"><div class="logo">R</div>{{product}}</div>
  <div class="icon" aria-hidden="true">{{icon}}</div>
  <div><h1>{{title}}</h1><p>{{text}}</p></div>
  <p class="foot">127.0.0.1 · Ramal</p>
</main>
</body>
</html>
