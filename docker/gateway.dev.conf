# Puerta de entrada del entorno de desarrollo: la web y la API bajo un mismo
# origen. Sin esto el navegador bloquea las llamadas de la web a la API, porque
# son puertos distintos y la API no manda cabeceras CORS.
#
# Este fichero se incluye dentro del bloque http de nginx (conf.d).
#
# El orden importa: cada prefijo de la API tiene su `location` ANTES de
# "location /", que manda todo lo demas a la web. Un prefijo nuevo de la API
# necesita su bloque aqui y una sonda en tools/scripts/smoke-stack.sh.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream ramal_web {
  server web:5173;
}

upstream ramal_api {
  server api:8080;
}

server {
  listen 8080;
  server_name _;

  location /health/ {
    proxy_pass http://ramal_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /openapi.json {
    proxy_pass http://ramal_api;
    proxy_set_header Host $host;
  }

  location /swagger-ui {
    proxy_pass http://ramal_api;
    proxy_set_header Host $host;
  }

  # La API de dominio. Sin este bloque las peticiones a /v1 acaban en la web,
  # que responde HTML con 200 en los GET y un error en los POST: justo el fallo
  # que tuvo Gastonomo. X-Forwarded-For es obligatorio: un limite de peticiones
  # por cliente lee su ULTIMA entrada, y es $proxy_add_x_forwarded_for quien la
  # anade. Sin la cabecera, todas las peticiones parecen venir del gateway.
  location /v1/ {
    proxy_pass http://ramal_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # La web, con el websocket de HMR de Vite incluido.
  location / {
    proxy_pass http://ramal_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
}
