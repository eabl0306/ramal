# Paquetes TypeScript compartidos (@ramal/domain, i18n, ui, repo-view, bridge y
# api-client): lint con las reglas de arquitectura, tipos estrictos y tests con
# sus umbrales de cobertura (80% en domain e i18n, 60% en el resto).
#
# Corre la misma receta que en local, `just packages-check`. La receta salta con
# un aviso los paquetes cuya carpeta todavia no existe, pero falla si un paquete
# que existe no cumple el contrato o si cualquiera de sus comprobaciones falla:
# el detalle esta en el comentario de la receta en el justfile.
name: packages

on:
  workflow_call:

permissions:
  contents: read

env:
  CI: 'true'
  # El justfile usa `corepack pnpm` por defecto; aqui pnpm ya lo instala la
  # action con la version de packageManager.
  PNPM: pnpm

jobs:
  verify:
    name: lint, tipos y cobertura
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Paquetes compartidos (just packages-check)
        run: just packages-check

      - name: Subir informes de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages-coverage
          path: packages/*/coverage
          if-no-files-found: ignore
