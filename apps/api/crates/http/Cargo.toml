[package]
name = "ramal-api-http"
description = "Adaptador HTTP de la API con Salvo: rutas, handlers, DTOs y OpenAPI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ramal-api-application = { workspace = true }
ramal-api-domain = { workspace = true }
salvo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Solo para vigilar la senal de apagado mientras el servidor atiende.
tokio = { workspace = true }
tracing = { workspace = true }
# Identificadores de peticion cuando el cliente no manda `x-request-id`.
uuid = { workspace = true }

[dev-dependencies]
ramal-api-application = { workspace = true, features = ["testing"] }

[lints]
workspace = true
