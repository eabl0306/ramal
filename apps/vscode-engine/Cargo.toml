[package]
name = "git-rudder-vscode-engine"
description = "Sidecar de la extension de VS Code: el motor de Git servido por JSON-RPC 2.0 sobre stdio."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# El arranque es una funcion de biblioteca y main.rs es una llamada: asi los tests
# (y cargo-llvm-cov) cubren tambien el composition root (ADR 0006).
[lib]
path = "src/lib.rs"

[[bin]]
name = "git-rudder-vscode-engine"
path = "src/main.rs"

# Solo el motor y el protocolo del workspace: el host habla con el motor, no con
# sus piezas (lo vigila crates/engine/tests/architecture.rs).
[dependencies]
git-rudder-engine = { workspace = true }
git-rudder-protocol = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "sync"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
