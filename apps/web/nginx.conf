# nginx de la imagen de produccion de la web. Configuracion completa (no solo un
# server) para correr como usuario sin privilegios: PID y temporales en /tmp.
#
# Sirve el build estatico de React Router (ADR 0015): las landings
# prerenderizadas (index.html y en/index.html), sus datos (_.data) y, para
# cualquier otra ruta, el fallback de la SPA. La CSP y el resto de cabeceras del
# producto las pone el gateway; aqui solo las que valen para cualquier fichero.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  # Los datos de las rutas prerenderizadas, con el tipo que les da React Router.
  types {
    text/x-script data;
  }
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/x-script application/javascript application/json image/svg+xml;

  # La politica de cache se resuelve por URI y no con un add_header en cada
  # location: nginx NO hereda los add_header del server cuando un location
  # declara los suyos, y las cabeceras de seguridad desaparecerian justo en las
  # rutas que sirven contenido (lo aprendio Gastonomo). Solo los assets con hash
  # se cachean para siempre; el HTML, incluido el fallback, nunca.
  #
  # Cache-Control va SIN "always": un 404 bajo /assets/ (un despliegue a medias)
  # no debe quedarse cacheado un ano en el navegador.
  map $uri $cache_policy {
    default    "no-store";
    ~^/assets/ "public, max-age=31536000, immutable";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Las redirecciones de nginx no deben llevar el puerto interno del contenedor.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_policy;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Un asset que no existe es un 404, nunca la SPA con un 200.
    location /assets/ {
      try_files $uri =404;
    }

    # El fichero si existe; si no, el index.html de su carpeta (la landing de
    # /en sin barra) y si no, el fallback de la SPA para las rutas del cliente.
    location / {
      try_files $uri $uri/index.html /__spa-fallback.html;
    }
  }
}
