# Pila de DESARROLLO. Codigo montado, recarga en caliente y puertos a mano en
# la maquina.
#
#   just db-up    (solo Postgres: lo que necesitan los tests de la API)
#   just up       (la pila entera, perfil full)
#   just logs
#   just down
#
# api, web, gateway y mailpit van en el perfil `full`. Sin perfil, compose solo
# levanta la base de datos, y asi `just db-up` funciona aunque las apps todavia
# no tengan su Dockerfile.dev. Las recetas de la pila entera pasan
# `--profile full` (variable compose_full del justfile).
#
# Las variables salen de .env (copia .env.example). Todas tienen valor por defecto.
#
# Los puertos se publican solo en 127.0.0.1 (RAMAL_BIND_IP). Docker abre los
# puertos publicados por su cuenta, saltandose el cortafuegos de la maquina: sin
# IP, Postgres con la contrasena por defecto quedaria abierto a toda la red local
# (una wifi compartida, por ejemplo). Quien necesite entrar desde otra maquina
# pone RAMAL_BIND_IP=0.0.0.0 en su .env.

name: ramal

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ramal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ramal}
      POSTGRES_DB: ${POSTGRES_DB:-ramal}
    ports:
      - '${RAMAL_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # postgres:18 guarda los datos en un subdirectorio por version mayor: el
      # volumen va en /var/lib/postgresql, no en /var/lib/postgresql/data. Con la
      # ruta vieja el contenedor no arranca.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ramal} -d ${POSTGRES_DB:-ramal}']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    profiles: [full]
    build:
      # Contexto en la raiz: el workspace de Cargo y el Cargo.lock viven aqui, no
      # en apps/api. La imagen de desarrollo no copia nada (su
      # Dockerfile.dev.dockerignore deja el contexto vacio): el codigo va montado.
      context: .
      dockerfile: apps/api/Dockerfile.dev
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-default}
    # Solo lo que la API usa hoy. Cuando mande correo (verificacion,
    # recuperacion), vuelve aqui `mailpit: condition: service_healthy`.
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAMAL__SERVER__HOST: 0.0.0.0
      RAMAL__SERVER__PORT: '8080'
      RAMAL__DATABASE__URL: postgres://${POSTGRES_USER:-ramal}:${POSTGRES_PASSWORD:-ramal}@db:5432/${POSTGRES_DB:-ramal}
      RAMAL__TELEMETRY__LOG_LEVEL: ${RAMAL__TELEMETRY__LOG_LEVEL:-debug}
      # El visor de la API solo en desarrollo: la API lo deja apagado si nadie lo
      # pide, que es como arranca la imagen de produccion.
      RAMAL__SERVER__SWAGGER_UI: 'true'
      # Hilos de cargo dentro del contenedor; "default" son todos los nucleos.
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-default}
      # Fuera del bind mount a proposito. Si el directorio de compilacion cuelga
      # del codigo montado, docker lo crea en el repositorio del host como root
      # cada vez que se levanta la pila, y ahi se queda: git lo ve, los guards lo
      # recorren y no se puede borrar sin sudo.
      CARGO_TARGET_DIR: /cargo-target
    ports:
      - '${RAMAL_BIND_IP:-127.0.0.1}:${API_PORT:-8080}:8080'
    volumes:
      # El codigo en caliente. El target y el registro de cargo viven en
      # volumenes para no pelearse con los del host ni perder la cache.
      - .:/app
      - api-cargo-registry:/usr/local/cargo/registry
      - api-target:/cargo-target
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:8080/health/live || exit 1']
      interval: 10s
      timeout: 3s
      retries: 30
      # La primera compilacion del workspace dentro del contenedor tarda.
      start_period: 300s

  web:
    profiles: [full]
    build:
      # Contexto en la raiz: el lockfile de pnpm y los paquetes compartidos viven aqui.
      context: .
      dockerfile: apps/web/Dockerfile.dev
    depends_on:
      api:
        condition: service_started
    environment:
      # Entrando por el gateway no hace falta; entrando directo al 5173, el proxy de
      # Vite manda la API al servicio api en vez de a 127.0.0.1.
      VITE_DEV_API_TARGET: http://api:8080
    ports:
      - '${RAMAL_BIND_IP:-127.0.0.1}:${WEB_PORT:-5173}:5173'
    volumes:
      # Solo el codigo fuente, carpeta a carpeta. Montar packages/ entero taparia
      # los node_modules de cada paquete con los del host, que son de otra
      # plataforma (glibc fuera, musl dentro). La configuracion (vite.config.ts,
      # react-router.config.ts) va en la imagen: si cambia, `just up` reconstruye.
      - ./apps/web/src:/repo/apps/web/src
      - ./packages/domain/src:/repo/packages/domain/src
      - ./packages/i18n/src:/repo/packages/i18n/src
      - ./packages/ui/src:/repo/packages/ui/src
      - ./packages/api-client/src:/repo/packages/api-client/src
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:5173/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Buzon de correo de desarrollo. La API le habla por SMTP en el 1025 y los
  # mensajes se leen en http://localhost:8025. No sale nada a internet.
  mailpit:
    profiles: [full]
    image: axllent/mailpit:latest
    ports:
      - '${RAMAL_BIND_IP:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025'
      - '${RAMAL_BIND_IP:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8025/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Un solo origen para la web y la API. Es por donde hay que entrar:
  # http://localhost:8090 sirve la web y reenvia a la API lo que es suyo.
  gateway:
    profiles: [full]
    image: nginx:alpine
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - '${RAMAL_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-8090}:8080'
    volumes:
      - ./docker/gateway.dev.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --quiet --tries=1 --spider http://127.0.0.1:8080/health/live || exit 1']
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  api-cargo-registry:
  api-target:
