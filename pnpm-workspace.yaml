packages:
  - "apps/web"
  - "apps/desktop"
  - "apps/vscode"
  - "packages/*"
  - "tools/*"
# engines.node de package.json se hace cumplir en el install. pnpm 11 ya no lee
# esta opcion de .npmrc (solo lee de alli el registro y la autenticacion), por eso
# vive aqui y el repo no tiene .npmrc.
engineStrict: true
# pnpm 11 se niega a instalar si una dependencia trae scripts de instalacion que
# nadie ha aprobado. Cada entrada nueva aqui es una decision: ese paquete puede
# ejecutar codigo en `pnpm install`.
allowBuilds:
  # Denegado a proposito: su postinstall solo copia el binario de firma desde su
  # paquete por plataforma, y `vsce package` (la VSIX de apps/vscode) no firma.
  '@vscode/vsce-sign': false
  # WebdriverIO los arrastra para descargar los drivers de Edge y Firefox al
  # instalar. El E2E nativo de escritorio usa el driver embebido en la app de
  # Tauri, asi que se deniegan: nada se descarga ni se ejecuta en `pnpm install`.
  edgedriver: false
  esbuild: true
  geckodriver: false
  lefthook: true
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    # jsx-a11y 6.10.2 aun no declara ESLint 10 en sus peers, pero sus reglas
    # funcionan (comprobado en Gastonomo con jsx-a11y/alt-text). Se acepta
    # explicitamente en lugar de dejar el aviso suelto en cada instalacion.
    eslint-plugin-jsx-a11y>eslint: "10"
    # openapi-typescript 7.13.0 declara typescript ^5.x, pero solo usa la API
    # estable del compilador para imprimir el esquema, que no cambia en la 6.
    # Lo genera @git-rudder/api-client y `just api-client` comprueba que sale igual.
    openapi-typescript>typescript: "6"
